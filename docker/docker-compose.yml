version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: aihealthcare-backend
    ports:
      - "8006:8000"
    env_file:
      - .env.docker
    environment:
      - DATABASE_URL=postgresql://healthcare_user:${POSTGRES_PASSWORD:-healthcare_password}@postgres:5432/healthcare
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
    networks:
      - aihealthcare-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        API_BACKEND_URL: http://backend:8000
    container_name: aihealthcare-frontend
    ports:
      - "3006:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8006
      - API_BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - aihealthcare-network

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: aihealthcare-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=healthcare_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-healthcare_password}
      - POSTGRES_DB=healthcare
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - aihealthcare-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthcare_user"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Redis Cache & Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: aihealthcare-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - aihealthcare-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  aihealthcare-network:
    driver: bridge
